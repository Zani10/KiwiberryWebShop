{% extends "base.html" %}

{% block title %}Login - Kiwiberry Orchard{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-4">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white text-center py-3">
                    <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>Login</h4>
                </div>

                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="your.email@example.com"
                                   autocomplete="email"
                                   required
                                   value="{{ request.form.email if request.form.email else '' }}">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Enter your password"
                                   autocomplete="current-password"
                                   required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-footer bg-transparent text-center py-3">
                    <small class="text-muted">
                        Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-semibold">Register here</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
